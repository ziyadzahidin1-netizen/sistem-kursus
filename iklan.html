<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenis & Iklan Kursus Terkini</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-new {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* Susunan Bersebelahan untuk Butang Tindakan Kad */
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-info {
            flex: 1;
            background-color: #4fc1e9;
            color: #ffffff;
            padding: 8px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: none;
            transition: background 0.2s ease;
        }

        .btn-info:hover {
            background-color: #3bafda;
        }

        .btn-card-apply {
            flex: 1;
            background-color: #5cb85c !important;
            color: #ffffff !important;
            padding: 8px 10px !important;
            border-radius: 4px !important;
            text-decoration: none !important;
            font-size: 0.85rem !important;
            font-weight: 600 !important;
            text-align: center !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 5px !important;
            border: none !important;
            margin-top: 0 !important;
            transition: background 0.2s ease;
        }

        .btn-card-apply:hover {
            background-color: #4cae4c !important;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Portal Kursus" class="logo-img">
            <span>Portal kursus</span>
        </div>

        <div class="menu-toggle" id="mobile-menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="nav-links" id="nav-links">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Utama</a>
            <a href="iklan.html" class="nav-btn active"><i class="fa-solid fa-bullhorn"></i> Jenis & Iklan Kursus</a>
            <a href="takwim.html" class="nav-btn"><i class="fa-solid fa-calendar-days"></i> Takwim Kursus</a>
            <a href="mohon.html" class="nav-btn btn-apply"><i class="fa-solid fa-paper-plane"></i> Mohon Kursus</a>
        </nav>
    </header>

    <div class="container page-wrapper">
        <div class="section-title">
            <h2>Iklan & Jenis Kursus Ditawarkan</h2>
            <p>Pilih program latihan kemahiran terbaik untuk meningkatkan potensi anda.</p>
        </div>

        <!-- KONTENA GRID UNTUK SEMUA KAD KURSUS -->
        <div class="cards-grid" id="main-courses-grid">
            <div id="dynamic-courses-wrapper" style="display: contents;"></div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Kementerian Sains, Teknologi dan Inovasi (MOSTI). Hak Cipta Terpelihara.</p>
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('nav-links');
            const menuToggle = document.getElementById('mobile-menu');
            navLinks.classList.toggle('active');
            menuToggle.classList.toggle('active');
        }

        function renderAdminCoursesOnly() {
            const wrapper = document.getElementById('dynamic-courses-wrapper');
            let customCourses = [];

            try {
                // Ambil KURSUS ADMIN SAHAJA dari localStorage
                customCourses = JSON.parse(localStorage.getItem('custom_courses')) || [];
            } catch(e) {
                customCourses = [];
            }

            // Jika tiada kursus yang ditambah oleh admin
            if (customCourses.length === 0) {
                wrapper.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #64748b;">
                        <i class="fa-solid fa-folder-open" style="font-size: 3rem; margin-bottom: 15px; color: #cbd5e1;"></i>
                        <h3>Tiada Kursus Ditawarkan Buat Masa Ini</h3>
                    </div>
                `;
                return;
            }

            // Paparkan HANYA kursus yang ditambah/dikemaskini admin
            let htmlContent = '';
            customCourses.forEach((item) => {
                const img = item.gambar_url || 'logo.png';
                htmlContent += `
                    <div class="card">
                        <span class="badge-new"><i class="fa-solid fa-sparkles"></i> Terkini</span>
                        <img src="${img}" alt="${item.tajuk}" style="width: 100%; height: 200px; object-fit: cover; display: block;">
                        <h3>${item.tajuk}</h3>
                        <p><strong>Tempoh:</strong> ${item.tarikh || '-'}</p>
                        <p><strong>Lokasi:</strong> ${item.tempat || '-'}</p>
                        <p style="font-size: 0.9rem; color: #64748b;">${item.penerangan || ''}</p>
                        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
                        <div class="card-actions">
                            <a href="maklumat_lanjut.html?id=${encodeURIComponent(item.id || '')}&kursus=${encodeURIComponent(item.tajuk)}" class="btn-info">Maklumat Lanjut &raquo;</a>
                            <a href="mohon.html?kursus=${encodeURIComponent(item.tajuk)}" class="btn-primary btn-card-apply"><i class="fa-solid fa-pen-to-square"></i> Mohon</a>
                        </div>
                    </div>
                `;
            });
            wrapper.innerHTML = htmlContent;
        }

        // Jalankan SERTA-MERTA sebaik sahaja DOM siap diproses (Tanpa sebarang delay/fetch API)
        document.addEventListener('DOMContentLoaded', renderAdminCoursesOnly);

        // Kemaskini automatik sekiranya admin menambah/memadam kursus dari tab lain
        window.addEventListener('storage', (e) => {
            if (e.key === 'custom_courses') {
                renderAdminCoursesOnly();
            }
        });
    </script>
</body>
</html>
