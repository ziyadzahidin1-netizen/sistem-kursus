    <!-- Script Inisialisasi Kalendar 2026 -->

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: '2026-01-01', // Bermula dari Januari 2026
                locale: 'ms', // Bahasa Melayu
                headerToolbar: {
                    left: 'title',
                    center: '',
                    right: 'today prev,next'
                },
                buttonText: {
                    today: 'today'
                },
                dayHeaderFormat: { weekday: 'short' }, // Ahd, Isn, Sel...
                
                // Senarai Kursus sepanjang tahun 2026
                events: [
                    { title: 'Kursus Aplikasi Asas Generative AI MOSTI TAHUN 2026', start: '2026-08-20',  end: '2026-08-22', url: 'mohon.html', color: '#64748b' },

                    { title: 'MS Excel Lanjutan', start: '2026-07-13', url: 'mohon.html', color: '#64748b' },

            calendar.render();
