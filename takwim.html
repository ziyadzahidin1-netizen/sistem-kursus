    <!-- Script Inisialisasi Kalendar Dinamik -->
    <script>
        let currentUser = null;
        let calendar = null;

        const BULAN_MELAYU = [
            "Januari", "Februari", "Mac", "April", "Mei", "Jun",
            "Julai", "Ogos", "September", "Oktober", "November", "Disember"
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const storedUser = sessionStorage.getItem('user') || localStorage.getItem('user');
            if (storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                } catch(e) { console.error(e); }
            }

            if (!currentUser) {
                currentUser = {
                    nama: "ZIYAD ZAHIDIN BIN YUSRI AMRI",
                    email: "admin@mosti.gov.my",
                    role: "admin",
                    gambar: "logo.png"
                };
                sessionStorage.setItem('user', JSON.stringify(currentUser));
                localStorage.setItem('user', JSON.stringify(currentUser));
            }

            setupNavbar();

            const calendarEl = document.getElementById('calendar');
            const todayIso = new Date().toISOString().split('T')[0];

            // 1. Ambil acara dari cache terlebih dahulu supaya kalendar muncul 0ms tanpa menunggu API
            const cachedRaw = sessionStorage.getItem('cached_takwim');
            const initialEvents = cachedRaw ? formatCoursesToEvents(JSON.parse(cachedRaw)) : [];

            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                initialDate: todayIso,
                locale: 'ms',
                headerToolbar: {
                    left: '',
                    center: '',
                    right: 'today prev,next'
                },
                buttonText: {
                    today: 'Hari Ini'
                },
                dayHeaderFormat: { weekday: 'short' },
                events: initialEvents,
                datesSet: function(dateInfo) {
                    syncDropdownWithCalendar(dateInfo.view.currentStart);
                },
                eventClick: function(info) {
                    if (info.event.url) {
                        window.location.href = info.event.url;
                        info.jsEvent.preventDefault();
                    }
                },
                eventDidMount: function(info) {
                    const tempat = info.event.extendedProps.tempat;
                    const masa = info.event.extendedProps.masa;
                    if (tempat || masa) {
                        info.el.title = `${info.event.title}\nTempat: ${tempat || '-'}\nMasa: ${masa || '-'}`;
                    }
                }
            });

            // 2. Render kalendar serta-merta
            calendar.render();
            injectCalendarDateDropdowns();

            // 3. Kemas kini acara terkini di latar belakang tanpa sekat UI
            refreshCalendarEvents();

            initCalendarRealtimeListener();

            window.addEventListener('storage', async function(e) {
                if (e.key === 'custom_courses') {
                    sessionStorage.removeItem('cached_takwim');
                    await refreshCalendarEvents();
                }
            });

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('userMenuDropdown');
                const btn = document.getElementById('userMenuBtn');
                if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        });

        /* BINA DROPDOWN BULAN & TAHUN DI TOOLBAR KIRI KALENDAR */
        function injectCalendarDateDropdowns() {
            const leftToolbarChunk = document.querySelector('#calendar .fc-toolbar-chunk:first-child');
            if (!leftToolbarChunk) return;

            const currentViewDate = calendar.getDate();
            const currentMonth = currentViewDate.getMonth();
            const currentYear = currentViewDate.getFullYear();

            const selectorWrapper = document.createElement('div');
            selectorWrapper.className = 'calendar-date-selector-group';

            const monthSelect = document.createElement('select');
            monthSelect.id = 'cal-month-select';
            monthSelect.className = 'calendar-select-dropdown';
            monthSelect.setAttribute('aria-label', 'Pilih Bulan');

            BULAN_MELAYU.forEach((namaBulan, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = namaBulan;
                if (index === currentMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            });

            const yearSelect = document.createElement('select');
            yearSelect.id = 'cal-year-select';
            yearSelect.className = 'calendar-select-dropdown';
            yearSelect.setAttribute('aria-label', 'Pilih Tahun');

            const startYear = new Date().getFullYear() - 5;
            const endYear = new Date().getFullYear() + 5;
            for (let y = startYear; y <= endYear; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            const handleDateDropdownChange = () => {
                const selectedMonth = parseInt(monthSelect.value, 10);
                const selectedYear = parseInt(yearSelect.value, 10);
                const targetDate = new Date(selectedYear, selectedMonth, 1);
                calendar.gotoDate(targetDate);
            };

            monthSelect.addEventListener('change', handleDateDropdownChange);
            yearSelect.addEventListener('change', handleDateDropdownChange);

            selectorWrapper.appendChild(monthSelect);
            selectorWrapper.appendChild(yearSelect);
            leftToolbarChunk.appendChild(selectorWrapper);
        }

        function syncDropdownWithCalendar(currentDate) {
            const monthSelect = document.getElementById('cal-month-select');
            const yearSelect = document.getElementById('cal-year-select');
            if (!monthSelect || !yearSelect || !currentDate) return;

            const m = currentDate.getMonth();
            const y = currentDate.getFullYear();

            monthSelect.value = m;

            if (!Array.from(yearSelect.options).some(opt => parseInt(opt.value, 10) === y)) {
                const newOpt = document.createElement('option');
                newOpt.value = y;
                newOpt.textContent = y;
                yearSelect.appendChild(newOpt);
            }
            yearSelect.value = y;
        }

        function initCalendarRealtimeListener() {
            if (!!window.EventSource) {
                const eventSource = new EventSource('/api/events');
                eventSource.onmessage = async function(e) {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.type === 'COURSE_UPDATED') {
                            sessionStorage.removeItem('cached_takwim');
                            await refreshCalendarEvents();
                        }
                    } catch (err) {
                        console.error('Ralat SSE Takwim:', err);
                    }
                };
            }
        }

        async function refreshCalendarEvents() {
            if (!calendar) return;
            const updatedEvents = await fetchAndFormatCalendarEvents();
            if (updatedEvents) {
                calendar.removeAllEvents();
                calendar.addEventSource(updatedEvents);
            }
        }

        function handleNavSearch() {
            const inputVal = document.getElementById('top-nav-search-input').value.trim();
            if (inputVal) {
                window.location.href = `iklan.html?keyword=${encodeURIComponent(inputVal)}`;
            }
        }

        function setupNavbar() {
            const navContainer = document.getElementById('user-nav-container');
            if (currentUser && navContainer) {
                const userPhoto = currentUser.gambar || 'https://via.placeholder.com/150';
                const userName = currentUser.nama || 'Pengguna';

                const adminMenuOption = currentUser.role === 'admin' 
                    ? `<a href="admin_dashboard.html"><i class="fa-solid fa-user-shield"></i> Peranan Admin</a>` 
                    : '';

                navContainer.innerHTML = `
                    <div class="user-dropdown-container">
                        <button id="userMenuBtn" onclick="toggleUserDropdown()" class="user-dropdown-btn">

                            <span>${userName}</span>
                            <i class="fa-solid fa-chevron-down" style="font-size: 0.8rem;"></i>
                        </button>
                        <div id="userMenuDropdown" class="dropdown-menu">
                            <a href="user_dashboard.html"><i class="fa-solid fa-id-card"></i> User Dashboard</a>
                            ${adminMenuOption}
                            <a href="tukar_kata_laluan.html"><i class="fa-solid fa-key"></i> Tukar Kata Laluan</a>
                            <button onclick="handleLogout()" class="logout-item"><i class="fa-solid fa-right-from-bracket"></i> Log Keluar</button>
                        </div>
                    </div>
                `;
            }
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userMenuDropdown');
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('user');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        function parseDateRangeToIso(dateStr) {
            if (!dateStr) return null;

            const cleanInput = dateStr.trim();

            if (/^\d{4}-\d{2}-\d{2}$/.test(cleanInput)) {
                return { start: cleanInput, end: cleanInput };
            }

            const monthMap = {
                'januari': '01', 'jan': '01',
                'februari': '02', 'feb': '02',
                'mac': '03', 'mar': '03',
                'april': '04', 'apr': '04',
                'mei': '05',
                'jun': '06',
                'julai': '07', 'jul': '07',
                'ogos': '08', 'ogo': '08', 'aug': '08',
                'september': '09', 'sep': '09',
                'oktober': '10', 'okt': '10', 'oct': '10',
                'november': '11', 'nov': '11',
                'disember': '12', 'dis': '12', 'dec': '12'
            };

            const cleanStr = cleanInput.toLowerCase().replace(/[\,\.\:]/g, '');
            const yearMatch = cleanStr.match(/\b(20\d{2})\b/);
            const year = yearMatch ? yearMatch[1] : new Date().getFullYear().toString();

            const foundMonths = [];
            const words = cleanStr.split(/[\s\-–]+/);
            for (const w of words) {
                if (monthMap[w]) {
                    foundMonths.push(monthMap[w]);
                }
            }

            if (foundMonths.length === 0) return null;

            const dayMatches = cleanStr.replace(/\b20\d{2}\b/g, '').match(/\b(\d{1,2})\b/g);
            if (!dayMatches || dayMatches.length === 0) return null;

            const startDay = dayMatches[0].padStart(2, '0');
            const startMonth = foundMonths[0];
            const startDate = `${year}-${startMonth}-${startDay}`;

            let endDate = startDate;
            if (dayMatches.length > 1) {
                const endDay = dayMatches[dayMatches.length - 1].padStart(2, '0');
                const endMonth = foundMonths.length > 1 ? foundMonths[foundMonths.length - 1] : startMonth;
                endDate = `${year}-${endMonth}-${endDay}`;
            }

            return { start: startDate, end: endDate };
        }

        function formatCoursesToEvents(courses) {
            const events = [];

            (courses || []).forEach(item => {
                let startDate = item.tarikh_mula || item.startDate;
                let endDate = item.tarikh_tamat || item.endDate;

                if (!startDate && item.tarikh) {
                    const parsed = parseDateRangeToIso(item.tarikh);
                    if (parsed) {
                        startDate = parsed.start;
                        endDate = parsed.end;
                    }
                }

                if (startDate) {
                    let formattedEndDate = undefined;
                    if (endDate && endDate !== startDate) {
                        let endD = new Date(endDate + 'T00:00:00');
                        endD.setDate(endD.getDate() + 1);
                        formattedEndDate = endD.toISOString().split('T')[0];
                    }

                    events.push({
                        title: item.tajuk,
                        start: startDate,
                        end: formattedEndDate,
                        url: `mohon.html?kursus=${encodeURIComponent(item.tajuk)}`,
                        color: '#0c2847',
                        extendedProps: {
                            tempat: item.tempat || '',
                            masa: item.masa || ''
                        }
                    });
                }
            });

            return events;
        }

        // Ambil data ringan dari /api/takwim (tanpa gambar Base64)
        async function fetchAndFormatCalendarEvents() {
            let courses = null;

            try {
                const response = await fetch('/api/takwim');
                if (response.ok) {
                    courses = await response.json();
                    const freshString = JSON.stringify(courses);
                    const cachedString = sessionStorage.getItem('cached_takwim');

                    // Jika data tiada perubahan berbanding cache sedia ada, elak re-render kalendar
                    if (freshString === cachedString) {
                        return null;
                    }

                    try {
                        sessionStorage.setItem('cached_takwim', freshString);
                    } catch (e) {}
                } else {
                    courses = JSON.parse(localStorage.getItem('custom_courses')) || [];
                }
            } catch (e) {
                console.warn('Gagal mengambil data API takwim, menggunakan cache tempatan:', e);
                courses = JSON.parse(localStorage.getItem('custom_courses')) || [];
            }

            return formatCoursesToEvents(courses);
        }
    </script>

</body>
</html>
