<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Portal Kursus MOSTI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Portal Kursus" class="logo-img">
            <span>Portal kursus</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn btn-primary"> Utama</a></li>
            <li><a href="login.html" class="nav-btn btn-apply"> Log Masuk</a></li>
        </ul>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2>Daftar Akaun Baru</h2>
                <p>Isi maklumat di bawah untuk pendaftaran akaun baru</p>
            </div>

            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Nama Penuh (Mengikut MyKad)</label>
                    <div class="input-container">
                        <input type="text" id="reg-name" placeholder="Ahmad Bin Abdullah" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-ic">Nombor MyKad</label>
                    <div class="input-container">
                        <input type="text" id="reg-ic" placeholder="900101105555" maxlength="12" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Alamat E-mel</label>
                    <div class="input-container">
                        <input type="email" id="reg-email" placeholder="contoh@mosti.gov.my" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-pass">Kata Laluan</label>
                    <div class="input-container">
                        <input type="password" id="reg-pass" placeholder="••••••••" minlength="8" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm">Sahkan Kata Laluan</label>
                    <div class="input-container">
                        <input type="password" id="reg-confirm" placeholder="••••••••" minlength="8" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
            </form>

            <div class="auth-footer">
                Sudah mempunyai akaun? <a href="login.html">Log Masuk</a>
            </div>
        </div>
    </main>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            
            const nama = document.getElementById('reg-name').value.trim();
            const ic = document.getElementById('reg-ic').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (pass !== confirm) {
                alert('Kata laluan tidak sepadan!');
                return;
            }

            try {
                // Hantar data pendaftaran ke API Server
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama, ic, email, password: pass })
                });

                const result = await response.json();

                if (response.ok) {
                    alert(result.message);
                    window.location.href = 'login.html';
                } else {
                    alert(result.error || 'Gagal mendaftar.');
                }
            } catch (error) {
                alert('Gagal berhubung dengan server. Pastikan server.js dimainkan!');
            }
        }
    </script>
</body>
</html>
