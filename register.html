<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Portal Kursus MOSTI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .role-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Portal Kursus" class="logo-img">
            <span>Portal kursus</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-btn active"><i class="fa-solid fa-house"></i> Utama</a></li>
            <li><a href="login.html" class="nav-btn active">Log Masuk</a></li>
        </ul>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon"></div>
                <h2>Daftar Akaun Baru</h2>
                <p>Isi maklumat di bawah untuk pendaftaran akaun baru</p>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-name">Nama Penuh (Mengikut MyKad)</label>
                    <div class="input-container">
                        <input type="text" id="reg-name" placeholder="Ahmad Bin Abdullah" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-ic">Nombor MyKad</label>
                    <div class="input-container">
                        <input type="text" id="reg-ic" placeholder="900101105555" maxlength="12" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-email">Alamat E-mel</label>
                    <div class="input-container">
                        <input type="email" id="reg-email" placeholder="contoh@mosti.gov.my" required>
                    </div>
                </div>

                <!-- Pilihan Peranan / Role -->
                <div class="form-group">
                    <label for="reg-role">Jenis Akaun</label>
                    <div class="input-container">
                        <select id="reg-role" class="role-select" onchange="toggleFormByRole()" required>
                            <option value="user">Pengguna Biasa / Peserta</option>
                            <option value="admin">Pentadbir (Admin)</option>
                        </select>
                    </div>
                </div>

                <!-- Kunci Rahsia Admin (Hanya dipaparkan untuk Admin) -->
                <div class="form-group" id="admin-key-group" style="display: none;">
                    <label for="reg-admin-key">Kunci Rahsia Admin (Secret Key)</label>
                    <div class="input-container">
                        <input type="password" id="reg-admin-key" placeholder="Masukkan Kunci Rahsia Admin">
                    </div>
                </div>

                <!-- Kata Laluan (Hanya dipaparkan untuk Pengguna Biasa) -->
                <div id="user-password-fields">
                    <div class="form-group">
                        <label for="reg-pass">Kata Laluan</label>
                        <div class="input-container">
                            <input type="password" id="reg-pass" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm">Sahkan Kata Laluan</label>
                        <div class="input-container">
                            <input type="password" id="reg-confirm" placeholder="••••••••" minlength="8" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang <i class="fa-solid fa-check-to-slot"></i></button>
            </form>

            <div class="auth-footer">
                Sudah mempunyai akaun? <a href="login.html">Log Masuk</a>
            </div>
        </div>
    </main>

    <script>
        function toggleFormByRole() {
            const role = document.getElementById('reg-role').value;
            const adminKeyGroup = document.getElementById('admin-key-group');
            const adminKeyInput = document.getElementById('reg-admin-key');
            const userPasswordFields = document.getElementById('user-password-fields');
            const passInput = document.getElementById('reg-pass');
            const confirmInput = document.getElementById('reg-confirm');
            
            if (role === 'admin') {
                // Tunjukkan Secret Key, sembunyikan Password
                adminKeyGroup.style.display = 'block';
                adminKeyInput.required = true;
                
                userPasswordFields.style.display = 'none';
                passInput.required = false;
                confirmInput.required = false;
                passInput.value = '';
                confirmInput.value = '';
            } else {
                // Tunjukkan Password, sembunyikan Secret Key
                adminKeyGroup.style.display = 'none';
                adminKeyInput.required = false;
                adminKeyInput.value = '';
                
                userPasswordFields.style.display = 'block';
                passInput.required = true;
                confirmInput.required = true;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            
            const nama = document.getElementById('reg-name').value.trim();
            const ic = document.getElementById('reg-ic').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const role = document.getElementById('reg-role').value;
            const adminKey = document.getElementById('reg-admin-key').value.trim();
            const password = document.getElementById('reg-pass').value;
            const confirmPassword = document.getElementById('reg-confirm').value;

            if (role === 'user' && password !== confirmPassword) {
                alert('Kata laluan dan pengesahan kata laluan tidak padan!');
                return;
            }

            const btnSubmit = document.querySelector('button[type="submit"]');
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = 'Memproses... <i class="fa-solid fa-spinner fa-spin"></i>';
            }

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nama, ic, email, role, adminKey, password })
                });

                const contentType = response.headers.get("content-type");
                
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (response.ok) {
                        alert(data.message || 'Pendaftaran berjaya! Sila log masuk.');
                        window.location.href = 'login.html';
                    } else {
                        alert('Gagal mendaftar: ' + (data.error || 'Maklumat tidak sah.'));
                    }
                } else {
                    const rawText = await response.text();
                    console.error("Non-JSON Response:", rawText);
                    alert(`Ralat Server (${response.status}): Respons bukan dalam format JSON.`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Ralat Server: ' + error.message);
            } finally {
                if (btnSubmit) {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Daftar Sekarang <i class="fa-solid fa-check-to-slot"></i>';
                }
            }
        }
    </script>
</body>
</html>
