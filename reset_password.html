<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetapan Semula Kata Laluan - Portal Kursus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .form-container-card {
            max-width: 460px;
            margin: 70px auto;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .card-header-title {
            background-color: #2563eb;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .card-body-content {
            padding: 25px;
        }
        .form-group-custom {
            margin-bottom: 20px;
        }
        .form-group-custom label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #1e293b;
        }
        .form-input-custom {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .btn-submit-custom {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit-custom:hover {
            background-color: #1d4ed8;
        }
        .btn-submit-custom:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .info-text {
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="logo.png" alt="Logo Portal" class="logo-img">
            <span>Portal kursus</span>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="nav-btn"><i class="fa-solid fa-house"></i> Utama</a>
            <a href="login.html" class="nav-btn"><i class="fa-solid fa-right-to-bracket"></i> Log Masuk</a>
        </nav>
    </header>

    <div class="form-container-card">
        <div class="card-header-title" id="card-title">
            <i class="fa-solid fa-envelope"></i> Lupa Kata Laluan
        </div>
        <div class="card-body-content">
            
            <!-- BORANG 1: Minta Pautan E-mel -->
            <form id="request-form" onsubmit="handleRequestReset(event)">
                <p class="info-text">
                    Masukkan alamat e-mel yang anda gunakan semasa mendaftar. Kami akan menghantar pautan untuk menetapkan semula kata laluan anda.
                </p>
                <div class="form-group-custom">
                    <label for="resetEmail">Alamat E-mel Berdaftar</label>
                    <input type="email" id="resetEmail" class="form-input-custom" required placeholder="contoh@mosti.gov.my">
                </div>
                <button type="submit" id="btn-request" class="btn-submit-custom">
                    <i class="fa-solid fa-paper-plane"></i> Hantar Pautan ke E-mel
                </button>
            </form>

            <!-- BORANG 2: Tetapkan Kata Laluan Baharu (Dipaparkan jika ada ?token= dalam URL) -->
            <form id="new-password-form" onsubmit="handleResetPassword(event)" style="display: none;">
                <p class="info-text">
                    Sila masukkan kata laluan baharu untuk akaun anda.
                </p>
                <div class="form-group-custom">
                    <label for="newPwd">Kata Laluan Baharu</label>
                    <input type="password" id="newPwd" class="form-input-custom" required minlength="6" placeholder="Minimum 6 aksara">
                </div>
                <div class="form-group-custom">
                    <label for="confirmPwd">Sahkan Kata Laluan Baharu</label>
                    <input type="password" id="confirmPwd" class="form-input-custom" required minlength="6" placeholder="Ulang kata laluan baharu">
                </div>
                <button type="submit" id="btn-reset" class="btn-submit-custom">
                    <i class="fa-solid fa-check"></i> Simpan Kata Laluan Baharu
                </button>
            </form>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            document.getElementById('card-title').innerHTML = '<i class="fa-solid fa-key"></i> Tetapkan Kata Laluan Baharu';
            document.getElementById('request-form').style.display = 'none';
            document.getElementById('new-password-form').style.display = 'block';
        }

        async function handleRequestReset(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('btn-request');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghantar E-mel...';

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    document.getElementById('request-form').reset();
                } else {
                    alert('Ralat: ' + (data.error || 'Gagal menghantar e-mel.'));
                }
            } catch (err) {
                alert('Ralat sambungan ke server: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Hantar Pautan ke E-mel';
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            const btn = document.getElementById('btn-reset');

            if (newPassword !== confirmPwd) {
                alert('Ralat: Kata laluan baharu dan pengesahan tidak padan!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengemaskini...';

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    alert(data.message);
                    window.location.href = 'login.html';
                } else {
                    alert('Ralat: ' + (data.error || 'Gagal menetapkan semula kata laluan.'));
                }
            } catch (err) {
                alert('Ralat sambungan ke server: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Simpan Kata Laluan Baharu';
            }
        }
    </script>
</body>
</html>
