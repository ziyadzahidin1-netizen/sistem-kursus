<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permohonan Kursus - Portal MOSTI</title>
    
    <!-- Pautan ke Fail CSS Asing -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts: Light & Clean Typography (Open Sans & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ASAS FONT KORPORAT NIPIS */
        body, button, input, select, textarea {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important;
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER DUA BARIS (SAMA MACAM INDEX.HTML) */
        .navbar-header-container {
            background-color: #0c2847 !important; /* Warna biru gelap */
            border-bottom: 1px solid #002b58;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* BARIS ATAS: LOGO (KIRI) & LINK PROFIL/LOG MASUK (KANAN) */
        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .header-title-group {
            display: flex;
            flex-direction: column;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.15;
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            padding-left: 12px;
        }

        .header-subtitle {
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            font-weight: 300;
            color: #cbd5e1;
        }

        .header-english-title {
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            color: #ffffff;
        }

        .header-tagline {
            font-size: 0.58rem;
            letter-spacing: 0.8px;
            margin-top: 1px;
            font-weight: 300;
            color: #ef7c00;
        }

        .header-top-right {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.85rem;
        }

        /* BARIS BAWAH: NAVIGASI UTAMA DI BAWAH LOGO */
        .header-bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px !important;
            background-color: #ffffff;
        }

        .nav-links-sub {
            display: flex;
            align-items: center;
            gap: 25px !important;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links-sub a {
            color: #334155;
            text-decoration: none;
            font-size: 0.9rem !important;
            font-weight: 300 !important;
            padding: 12px 0 !important;
            display: inline-block;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-links-sub a:hover, .nav-links-sub a.active {
            color: #003d7c;
            font-weight: 400 !important;
        }

        .nav-links-sub a.active::after, .nav-links-sub a:hover::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #ef7c00;
        }

        /* BAR CARIAN DI NAV BARIS BAWAH */
        .nav-search-box {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            padding: 4px 12px !important;
            transition: all 0.3s ease;
        }

        .nav-search-box:focus-within {
            background: #ffffff;
            border-color: #003d7c;
            box-shadow: 0 0 0 3px rgba(0, 61, 124, 0.1);
        }

        .nav-search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.82rem !important;
            color: #334155;
            width: 150px !important;
        }

        .nav-search-box button {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-search-box button:hover {
            color: #003d7c;
        }

        /* USER DROPDOWN SAMA MACAM INDEX */
        .user-dropdown-container {
            position: relative;
            display: inline-block;
        }
        .user-dropdown-btn {
            background: transparent;
            color: #ffffff;
            border: none;
            font-size: 0.88rem;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        .user-dropdown-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .user-avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ffffff;
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 8px;
            background-color: #ffffff;
            min-width: 200px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid #e2e8f0;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-menu a, .dropdown-menu button {
            color: #1e293b;
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }
        .dropdown-menu a:hover, .dropdown-menu button:hover {
            background-color: #f1f5f9;
        }
        .dropdown-menu .logout-item {
            color: #ef4444;
            border-top: 1px solid #e2e8f0;
        }
        .dropdown-menu .logout-item:hover {
            background-color: #fef2f2;
        }

        /* MAIN LAYOUT - STIL MINIMALIS NUS (FULL DESKTOP) */
        .auth-wrapper {
            max-width: 1280px;
            margin: 50px auto 80px auto;
            padding: 0 40px;
        }

        .auth-card {
            background: #ffffff;
            padding: 50px 60px;
            border-radius: 4px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.03);
            border: 1px solid #eaeaea;
        }

        .auth-header {
            margin-bottom: 40px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 25px;
        }

        .auth-header h2 {
            font-family: 'Open Sans', sans-serif;
            font-size: 2.2rem;
            font-weight: 300;
            color: #222222;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.95rem;
            color: #666666;
            font-weight: 300;
        }

        /* FORM GRID & INPUT STYLING */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 28px 40px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 400;
            color: #444444;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-icon-wrapper input,
        .input-icon-wrapper select {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 0.92rem;
            font-weight: 300;
            color: #222222;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
        }

        .input-icon-wrapper input[readonly] {
            background-color: #f8fafc;
            color: #64748b;
            border-color: #e2e8f0;
            cursor: not-allowed;
        }

        .input-icon-wrapper input:focus,
        .input-icon-wrapper select:focus {
            border-color: #0c2847;
            box-shadow: 0 0 0 3px rgba(12, 40, 71, 0.05);
        }

        .input-icon-wrapper input:focus + i,
        .input-icon-wrapper select:focus + i {
            color: #0c2847;
        }

        /* CUSTOM SELECT ARROW */
        .input-icon-wrapper select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3a64748b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        /* SUBMIT BUTTON */
        .btn-submit {
            background-color: #0c2847;
            color: #ffffff;
            border: none;
            padding: 14px 30px;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .btn-submit:hover {
            background-color: #003d7c;
            box-shadow: 0 4px 12px rgba(12, 40, 71, 0.15);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        @media screen and (max-width: 768px) {
            .header-top-row {
                padding: 10px 18px !important;
            }
            .header-bottom-nav {
                padding: 0 18px !important;
                overflow-x: auto;
            }
            .logo-img {
                height: 32px !important;
            }
            .header-subtitle, .header-english-title, .header-tagline {
                font-size: 0.55rem !important;
            }
            .nav-links-sub {
                gap: 15px !important;
            }
            .nav-links-sub a {
                font-size: 0.8rem !important;
                padding: 10px 0 !important;
            }
        }
    </style>
</head>
<body>

    <!-- CONTAINER HEADER DUA BARIS -->
    <header class="navbar-header-container">
        <!-- BARIS ATAS: LOGO MOSTI & PERANAN/LOG MASUK USER -->
        <div class="header-top-row">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Logo Portal Kursus MOSTI" class="logo-img">
                <div class="header-title-group">
                    <span class="header-subtitle">PORTAL KURSUS RASMI</span>
                    <span class="header-english-title">MINISTRY OF SCIENCE, TECHNOLOGY AND INNOVATION</span>
                    <span class="header-tagline">SAINS.TEKNOLOGI.INOVASI.BERSAMA</span>
                </div>
            </a>

            <div class="header-top-right">
                <span id="user-nav-container">
                    <a href="login.html" style="color: #ffffff; text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-user"></i> Log Masuk</a>

        </div>

        <!-- BARIS BAWAH: NAVIGASI UTAMA DI BAWAH LOGO & BAR CARIAN -->
        <div class="header-bottom-nav">
            <nav>
                <ul class="nav-links-sub" id="nav-links">

    </header>

    <!-- Main Container Permohonan - Full Desktop Box -->
    <main class="auth-wrapper">

            <div class="auth-header">
                <h2>Borang Permohonan Kursus</h2>
                <p>Maklumat anda diisi secara automatik berdasarkan akaun anda</p>

            <form id="courseForm" onsubmit="handleApply(event)" class="form-grid">

                    <label for="app-name">Nama Penuh</label>

                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="app-name" readonly placeholder="Nama Penuh">

                <div class="form-group">

                <div class="form-group full-width">

                            <option value="BAHAGIAN PEMINDAHAN TEKNOLOGI DAN PENGKOMERSIALAN R & D">BAHAGIAN PEMINDAHAN TEKNOLOGI DAN PENGKOMERSIALAN R & D</option>
                            <option value="BAHAGIAN PENGUASA ANGKASA">BAHAGIAN PENGUASA ANGKASA</option>

    <script src="script.js"></script>
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            const storedUser = sessionStorage.getItem('user') || localStorage.getItem('user');
            if (storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                } catch(e) { console.error(e); }
            }

            if (!currentUser) {
                currentUser = {
                    nama: "Pentadbir MOSTI",
                    email: "admin@mosti.gov.my",
                    role: "admin",
                    gambar: "logo.png"
                };
                sessionStorage.setItem('user', JSON.stringify(currentUser));
                localStorage.setItem('user', JSON.stringify(currentUser));
            }

            setupNavbar();
            loadUserData();
            loadAdminCoursesDropdown();

            document.addEventListener('click', (e) => {
                const dropdown = document.getElementById('userMenuDropdown');
                const btn = document.getElementById('userMenuBtn');
                if (dropdown && btn && !btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });
        });

        /* FUNGSI CARIAN BAR NAVIGASI TOP */
        function handleNavSearch() {
            const inputVal = document.getElementById('top-nav-search-input').value.trim();
            if (inputVal) {
                window.location.href = `iklan.html?keyword=${encodeURIComponent(inputVal)}`;
            }
        }

        function setupNavbar() {
            const navContainer = document.getElementById('user-nav-container');
            if (currentUser && navContainer) {
                const userPhoto = currentUser.gambar || 'https://via.placeholder.com/150';
                const userName = currentUser.nama || 'Pengguna';

                const adminMenuOption = currentUser.role === 'admin' 
                    ? `<a href="admin_dashboard.html"><i class="fa-solid fa-user-shield"></i> Peranan Admin</a>` 
                    : '';

                navContainer.innerHTML = `
                    <div class="user-dropdown-container">
                        <button id="userMenuBtn" onclick="toggleUserDropdown()" class="user-dropdown-btn">
                            <img src="${userPhoto}" alt="Avatar" class="user-avatar-small" id="navUserAvatar">
                            <span>${userName}</span>
                            <i class="fa-solid fa-chevron-down" style="font-size: 0.8rem;"></i>
                        </button>
                        <div id="userMenuDropdown" class="dropdown-menu">
                            <a href="user_dashboard.html"><i class="fa-solid fa-id-card"></i> User Dashboard</a>
                            ${adminMenuOption}
                            <a href="tukar_kata_laluan.html"><i class="fa-solid fa-key"></i> Tukar Kata Laluan</a>
                            <button onclick="handleLogout()" class="logout-item"><i class="fa-solid fa-right-from-bracket"></i> Log Keluar</button>
                        </div>
                    </div>
                `;
            }
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('userMenuDropdown');
            if (dropdown) {
                dropdown.classList.toggle('show');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('user');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        async function loadAdminCoursesDropdown() {
            const selectEl = document.getElementById('course-select');
            if (!selectEl) return;
            selectEl.innerHTML = '<option value="">-- Sila Pilih Kursus --</option>';

            let customCourses = [];
            try {
                const response = await fetch('/api/kursus');
                if (response.ok) {
                    customCourses = await response.json();
                }
            } catch (e) { console.warn('Gagal muat dari API server', e); }

            if (customCourses.length > 0) {
                const addedTitles = new Set();
                customCourses.forEach(item => {
                    const title = item.tajuk || item.title;
                    if (title && !addedTitles.has(title)) {
                        addedTitles.add(title);
                        const opt = document.createElement('option');
                        opt.value = title;
                        opt.textContent = title;
                        selectEl.appendChild(opt);
                    }
                });
            }

            const urlParams = new URLSearchParams(window.location.search);
            const selectedParam = urlParams.get('kursus');
            if (selectedParam) {
                selectEl.value = decodeURIComponent(selectedParam);
            }
        }

        function loadUserData() {
            const userData = localStorage.getItem('user') || sessionStorage.getItem('user');
            if (!userData) {
                alert('Sila log masuk terlebih dahulu.');
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(userData);
            document.getElementById('app-name').value = user.nama || user.name || '';
            document.getElementById('app-ic').value = user.ic || '';
            document.getElementById('app-email').value = user.email || '';
        }

        async function handleApply(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Menghantar Permohonan... <i class="fa-solid fa-spinner fa-spin"></i>';

            const icVal = document.getElementById('app-ic').value;
            const kursusVal = document.getElementById('course-select').value;

            const formData = {
                nama: document.getElementById('app-name').value,
                ic: icVal,
                email: document.getElementById('app-email').value,
                jawatan: document.getElementById('app-jawatan').value,
                gred: document.getElementById('app-gred').value,
                jabatan: document.getElementById('app-jabatan').value,
                penyakit: document.getElementById('app-penyakit').value,
                pengangkutan: document.getElementById('app-pengangkutan').value,
                kursus: kursusVal
            };

            // Simpan secara tempatan (Local Storage Backup)
            try {
                let allGlobalApps = JSON.parse(localStorage.getItem('all_global_applications')) || [];
                const newAppObj = {
                    id: Date.now().toString(),
                    ic: icVal,
                    user_ic: icVal,
                    nama_pemohon: formData.nama,
                    nama: formData.nama,
                    email: formData.email,
                    jawatan: formData.jawatan,
                    gred: formData.gred,
                    jabatan: formData.jabatan,
                    penyakit: formData.penyakit,
                    pengangkutan: formData.pengangkutan,
                    kod_kursus: 'KSR-' + Math.floor(100 + Math.random() * 900),
                    nama_kursus: kursusVal,
                    kursus: kursusVal,
                    created_at: new Date().toISOString(),
                    status: 'Dalam Proses'
                };

                allGlobalApps.unshift(newAppObj);
                localStorage.setItem('all_global_applications', JSON.stringify(allGlobalApps));

                let userApps = JSON.parse(localStorage.getItem('user_applications_' + icVal)) || [];
                userApps.unshift(newAppObj);
                localStorage.setItem('user_applications_' + icVal, JSON.stringify(userApps));
            } catch(err) { console.error("Ralat LocalStorage:", err); }

            // Hantar ke Backend API
            try {
                const response = await fetch('/api/mohon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('Permohonan anda berjaya dihantar!');
                    document.getElementById('courseForm').reset();
                    window.location.href = 'user_dashboard.html';
                } else {
                    const errData = await response.json();
                    alert('Gagal menghantar permohonan: ' + (errData.error || 'Sila cuba lagi.'));
                }
            } catch (error) {
                console.error('Backend API Error:', error);
                alert('Gagal menyambung ke server: ' + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Hantar Permohonan <i class="fa-solid fa-paper-plane"></i>';
            }
        }
    </script>
</body>
</html>
